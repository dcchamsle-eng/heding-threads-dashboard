name: Validate locally collected data
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check collected files
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          for path in Path('data').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8-sig'))
          with open('data/jobs_sheet.csv', encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          print(f'Validated {len(rows)} jobs')
          PY
